version: "3.8"

services:
  downloader:
    image: gautardos/downloader-app:latest
    container_name: downloader-container
    network_mode: host
    environment:
      - PORT=8000
    
    volumes:
      - /home/gautard/www/docker-downloader/var/home:/var/www/html/var/home
      - /home/gautard/www/docker-downloader/var/storage:/var/www/html/var/storage
      - /home/gautard/www/docker-downloader/var/db:/var/www/html/var/db #Remove on windows otherwise the search will be really slow
      - /home/gautard/www/downloader/src:/var/www/html/src
      - /home/gautard/Documents/downloads:/downloads
      - /home/gautard/Documents/music:/music
      - /home/gautard/Documents/storage:/nas
    
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
